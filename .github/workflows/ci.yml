name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dsh-0.1.5 client surface is not published to npm yet, so devDeps
      # link against the harness source. Check out the pinned master commit this
      # release was validated against (it mounts the session-projection registry
      # in the agent-loop testkit and exposes the live `agent/assistant-stream`
      # frames the degenerate-output watchdog needs) and expose it at the
      # sibling path the `link:../deepseek-harness/...` entries resolve from.
      - uses: actions/checkout@v4
        with:
          repository: whutzefengxie-ops/deepseek-harness
          ref: c291e7961a515f6d7af9304e7fd1d257929aef26
          fetch-depth: 1
          path: harness-source
      - name: Link the harness checkout where the devDeps expect it
        run: ln -s "$GITHUB_WORKSPACE/harness-source" "$GITHUB_WORKSPACE/../deepseek-harness"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable

      # corepack picks each repo's packageManager from its package.json
      # (pnpm 11.7.0 for the harness, 10.15.1 for this repo).
      - name: Install the pinned harness
        run: cd ../deepseek-harness && pnpm install --frozen-lockfile
      - name: Build the harness host and client faces
        run: cd ../deepseek-harness && pnpm run build:lib

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # The bundle installs the committed lib/, so a fresh build must reproduce
      # it exactly. Fail on any drift (modified, deleted, or stray untracked
      # build outputs) between the built tree and the committed artifacts.
      - name: Verify committed lib matches the build
        run: |
          git status --porcelain -- lib > lib-drift.txt
          if [ -s lib-drift.txt ]; then cat lib-drift.txt; git diff -- lib | head -200; exit 1; fi
      - run: npm pack --dry-run
